apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: a2a-worker-controller
  namespace: '{{ "NAMESPACE" | env }}'
data:
  sentry-dsn: '{{ "SENTRY_DSN_KEY" | env | teamvaultUrl | base64 }}'
  a2a-auth-token: '{{ "A2A_AUTH_TOKEN_KEY" | env | teamvaultUrl | base64 }}'
  # The tunnel secret the Mac's /relay/pull presents. A SECOND credential, not the bearer
  # token above: the Mac may drain its own workers' queued statuses without holding authority
  # to create or destroy workers.
  relay-secret: '{{ "A2A_PUSH_RELAY_SECRET_KEY" | env | teamvaultPassword | base64 }}'
