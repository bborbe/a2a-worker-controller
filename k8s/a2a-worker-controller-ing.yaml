apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a2a-worker-controller
  namespace: '{{ "NAMESPACE" | env }}'
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: 'traefik'
  rules:
    - host: 'a2a-worker-controller.{{ "NAMESPACE" | env }}.quant.benjamin-borbe.de'
      http:
        paths:
          # ⚠️ THE RELAY'S PULL HALF NEEDS THIS PATH, AND WITHOUT IT THE TUNNEL IS A NO-OP.
          # The Mac long-polls `/relay/pull` from outside the cluster, so a ClusterIP Service
          # alone never reaches it — and the `/` rule below goes to the `http` port, where the
          # relay's routes do not exist and the bearer-token gate would refuse the Mac anyway.
          #
          # ⚠️ `/relay/pull` EXACTLY, NOT A `/relay` PREFIX, AND THE DIFFERENCE IS AUTHENTICATION.
          # A prefix also publishes `/relay/push`, which is deliberately unauthenticated — the
          # notification token it requires is a routing key, not a credential (pkg/relay/relay.go).
          # Publishing it would let any internet caller fill the bounded queue until real workers
          # got 503. Workers push in-cluster through the Service and never touch this host, so the
          # ingress needs the pull half only, and that half is gated by the tunnel secret.
          #
          # `Exact` matches the path alone; the Mac's `?wait=25s` query is not part of the path.
          - backend:
              service:
                name: a2a-worker-controller
                port:
                  name: relay
            path: /relay/pull
            pathType: Exact
          - backend:
              service:
                name: a2a-worker-controller
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - secretName: tls-quant
      hosts:
        - 'a2a-worker-controller.{{ "NAMESPACE" | env }}.quant.benjamin-borbe.de'
